<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeVision — Webcam Capture Device</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="noise-overlay"></div>

    <header class="header">
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">SafeVision</span>
      </div>
      <div class="status-bar">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-label" id="statusLabel">OFFLINE</span>
        <button class="btn btn-logout" id="btnLogout" title="Logout">
          <span class="btn-icon">⊗</span> LOGOUT
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Video Preview -->
      <section class="preview-section">
        <div class="video-wrapper">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

          <video id="videoFeed" autoplay playsinline muted></video>

          <!-- Idle overlay -->
          <div class="idle-overlay" id="idleOverlay">
            <div class="idle-icon">
              <svg
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="24"
                  cy="24"
                  r="10"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M6 18V14C6 11.8 7.8 10 10 10H14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M42 18V14C42 11.8 40.2 10 38 10H34"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M6 30V34C6 36.2 7.8 38 10 38H14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M42 30V34C42 36.2 40.2 38 38 38H34"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <p>Kamera belum aktif</p>
            <p class="idle-sub">Tekan "Start Camera" untuk memulai</p>
          </div>

          <!-- Recording indicator -->
          <div class="rec-badge" id="recBadge">
            <span class="rec-dot"></span> REC
          </div>

          <!-- Frame counter -->
          <div class="frame-counter" id="frameCounter">
            FRAME: <span id="frameCount">0</span>
          </div>
        </div>

        <!-- Hidden canvas for capture -->
        <canvas id="captureCanvas" style="display: none"></canvas>
      </section>

      <!-- Controls & Stats -->
      <section class="controls-section">
        <div class="controls-group">
          <button class="btn btn-start" id="btnStart">
            <span class="btn-icon">▶</span>
            Start Camera
          </button>
          <button class="btn btn-stop" id="btnStop" disabled>
            <span class="btn-icon">■</span>
            Stop Camera
          </button>
        </div>

        <!-- Config Panel -->
        <div class="config-panel">
          <h3 class="config-title">KONFIGURASI</h3>


          <div class="config-row">
            <label for="captureInterval">Interval Kirim (ms)</label>
            <div class="range-wrapper">
              <input
                type="range"
                id="captureInterval"
                min="500"
                max="5000"
                step="500"
                value="1000"
              />
              <span class="range-value" id="intervalDisplay">1000 ms</span>
            </div>
          </div>

          <div class="config-row">
            <label for="captureSize">Resolusi Frame</label>
            <select id="captureSize">
              <option value="320x240">320 × 240</option>
              <option value="416x416" selected>416 × 416</option>
              <option value="640x480">640 × 480</option>
            </select>
          </div>

          <div class="config-row">
            <label for="jpegQuality">JPEG Quality</label>
            <div class="range-wrapper">
              <input
                type="range"
                id="jpegQuality"
                min="0.3"
                max="1"
                step="0.1"
                value="0.7"
              />
              <span class="range-value" id="qualityDisplay">0.7</span>
            </div>
          </div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
          <h3 class="config-title">STATISTIK</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="statSent">0</span>
              <span class="stat-label">Terkirim</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statFailed">0</span>
              <span class="stat-label">Gagal</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statSize">—</span>
              <span class="stat-label">Ukuran Terakhir</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="statLatency">—</span>
              <span class="stat-label">Latency</span>
            </div>
          </div>
        </div>

        <!-- Log -->
        <div class="log-panel">
          <h3 class="config-title">
            LOG <span class="log-clear" id="logClear">CLEAR</span>
          </h3>
          <div class="log-output" id="logOutput"></div>
        </div>
      </section>
    </main>

    <!-- Scripts -->
    <script type="module" src="../src/app.js"></script>
  </body>
</html>
