<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameCast — Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="noise-overlay"></div>

    <!-- Login Container -->
    <div class="login-container">
      <!-- Login Card -->
      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
          <span class="logo-dot"></span>
          <span class="logo-text">FrameCast</span>
        </div>

        <!-- Title & Description -->
        <div class="login-header">
          <h1 class="login-title">SISTEM LOGIN</h1>
          <p class="login-subtitle">Webcam Capture Device</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">
          <!-- Email Input (diubah dari username) -->
          <div class="form-group">
            <label for="username" class="form-label">Email</label>
            <input
              type="email"
              id="username"
              name="email"
              class="form-input"
              placeholder="Masukkan email Firebase"
              autofocus
              required
            />
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Masukkan password Firebase"
                required
              />

              <button type="button" id="togglePassword" class="password-toggle">
                <svg
                  id="eyeIcon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="22"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Error Message -->
          <div id="errorMessage" class="error-message"></div>

          <!-- Login Button -->
          <button type="submit" class="login-button">
            <span class="login-button-icon">▶</span>
            <span>LOGIN</span>
          </button>
        </form>
      </div>

      <!-- Bottom decoration -->
      <div class="login-decoration">
        <span class="decoration-line"></span>
        <span class="decoration-text">SECURE DEVICE</span>
        <span class="decoration-line"></span>
      </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="login-handler.js"></script>
  </body>
</html>
